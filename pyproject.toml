[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiolab"
authors = [{ name = "Zhendong Peng", email = "pzd17@tsinghua.org.cn" }]
description = "AudioLab"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "av>=17.0.0",
  "click",
  "humanize",
  "jinja2",
  "requests",
  "smart_open",
  "soundfile",
  "soxr>=1.0.0",
]

[project.scripts]
audi = "audiolab.cli:main"

[project.urls]
Homepage = "https://github.com/pengzhendong/audiolab"
Documentation = "https://github.com/pengzhendong/audiolab#readme"
BugTracker = "https://github.com/pengzhendong/audiolab/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"audiolab/reader/backend/wave.py" = ["SIM115"]
"audiolab/writer/backend/wave.py" = ["SIM115"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
audiolab = ["av/templates/*"]
