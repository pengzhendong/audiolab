name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            av-version: "17.0.0"
          - python-version: "3.12"
            av-version: "17.1.0"
          - python-version: "3.12"
            av-version: "18.1.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install pytest "av==${{ matrix.av-version }}" .
      - name: Run tests
        run: python -m pytest -q
